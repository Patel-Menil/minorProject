# no request bodies or query strings in the access log (conf.d files are in the http context)
log_format minimal '$remote_addr "$request_method $uri" $status';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # same-origin API: browser -> frontend -> backend (Docker service name)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;   # first final-model request loads the test hospitals
        client_max_body_size 1m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log minimal;
}
